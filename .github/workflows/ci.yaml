name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --group dev --python ${{ matrix.python-version }}

      - name: Check lint and formatting
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Check pinned catalog for drift
        run: ./scripts/generate_catalog.sh --check

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest

      - name: Build wheel
        run: uv build --wheel

      - name: Smoke-test installed wheel without dev dependencies
        run: >-
          uv run --isolated --no-project --python ${{ matrix.python-version }}
          --with dist/tokenary-0.2.0-py3-none-any.whl
          python -I scripts/smoke_installed.py
